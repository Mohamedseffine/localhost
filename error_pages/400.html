<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 Bad Request</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2.5rem; text-align: center; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    h1 { font-size: 3rem; margin: 0; color: #f87171; }
    h2 { font-size: 1.25rem; margin: 0.5rem 0 1rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    a { display: inline-block; background: #38bdf8; color: #0f172a; font-weight: 600; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>400</h1>
    <h2>Bad Request</h2>
    <p>The server could not understand the request due to invalid syntax or malformed headers.</p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
